<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aniversário da Maya</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fdf7f2;color:#5a4a42}
.hero{max-width:700px;margin:20px auto;padding:16px}
img{width:100%;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.card{background:#fff;border-radius:20px;padding:20px;margin-top:20px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.btn{display:block;text-align:center;text-decoration:none;background:#ff6fa8;color:#fff;padding:16px;border-radius:999px;font-weight:bold;margin:12px 0}
.btn.sec{background:#8f6b53}
#count{font-size:1.3rem;font-weight:bold;text-align:center}
footer{text-align:center;padding:30px;color:#777}
</style></head>
<body>
<div class="hero">
<img src="convite.png" alt="Convite">
<div class="card">
<h2 style="text-align:center">🎉 Esperamos você!</h2>
<p id="count"></p>
<a class="btn" href="https://wa.me/5527999656420?text=Olá!%20Confirmo%20minha%20presença%20no%20aniversário%20da%20Maya.">💖 Confirmar Presença</a>
<a class="btn sec" href="https://maps.google.com/?q=Rua+Juarez+Pereira+Sansão,+1250">📍 Como chegar</a>
<p><b>Recado aos pais</b><br>Será uma alegria receber sua família para comemorar os 7 aninhos da Maya! 💕</p>
</div>
<footer>Feito com ❤️ para a Maya</footer>
</div>
<script>
const alvo=new Date("2026-08-02T11:00:00");
function t(){let d=alvo-new Date();if(d<0){count.textContent="É hoje! 🎉";return;}
let dias=Math.floor(d/86400000);
let h=Math.floor(d%86400000/3600000);
let m=Math.floor(d%3600000/60000);
let s=Math.floor(d%60000/1000);
count.textContent=`Faltam ${dias} dias, ${h}h ${m}m ${s}s`;
}
setInterval(t,1000);t();
</script>
</body></html>
